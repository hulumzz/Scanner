<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}KK Scanner{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="/dashboard"><b>KK Scanner</b><small>Lambanggelun</small></a>
      <nav>
        <a href="/dashboard">Beranda</a>
        <a href="/scan">Impor</a>
        <a href="/batches">Hasil</a>
        <a href="/exports">Excel</a>
      </nav>
      <form method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button>Keluar</button></form>
    </aside>
    <main class="content">{% block content %}{% endblock %}</main>
  </div>
  <div id="toast" class="toast"></div>
  <script>window.CSRF_TOKEN=document.querySelector('meta[name="csrf-token"]').content;</script>
  {% block scripts %}{% endblock %}
</body>
</html>
